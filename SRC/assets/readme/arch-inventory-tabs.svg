<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <linearGradient id="bgInv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131c"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bgInv)" stroke="#0284c7" stroke-width="2"/>
  <text x="600" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="22" font-weight="900" fill="#38bdf8">KIẾN TRÚC HÀNH TRANG 1.000 Ô LIÊN TỤC • 5 SET TRANG BỊ NHANH &amp; KHÓA BẢO VỆ</text>
  <text x="600" y="68" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#94a3b8">Khởi tạo mặc định 1.000 Ô Hành Trang &amp; 120 Ô Rương Đồ • Swap nhanh 5 Set Trang Bị (s1..s5 / d1..d5) • Khóa Bảo Vệ Trang Bị (Option 39)</text>

  <!-- Active Bag Window (Left) -->
  <g transform="translate(40, 100)">
    <rect width="340" height="285" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="2.5"/>
    <rect width="340" height="42" rx="14" fill="#16a34a"/>
    <text x="170" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#ffffff">HÀNH TRANG 1.000 Ô LIÊN TỤC</text>
    <text x="170" y="70" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#4ade80">Mở sẵn 100%: 1.000 Ô Túi + 120 Ô Rương</text>
    <text x="170" y="94" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#cbd5e1">Tự động dồn gọn ô trống • Cộng dồn 100 Triệu/Ô</text>

    <!-- Mini Grid representing 1000 slots -->
    <g transform="translate(30, 112)">
      <rect x="0" y="0" width="280" height="110" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="140" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fde047">[Ô 0001] [Ô 0002] ... [Ô 0500]</text>
      <text x="140" y="60" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">[Ô 0501] [Ô 0502] ... [Ô 1000]</text>
      <text x="140" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#a855f7">Nút "Thêm vào AutoItem" ngay trên món đồ</text>
    </g>
    <text x="170" y="255" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#f59e0b">Khóa trang bị: Gõ "khoa" (Chống vứt/bán/phân rã)</text>
  </g>

  <!-- Arrow -->
  <line x1="390" y1="235" x2="455" y2="235" stroke="#22c55e" stroke-width="3" marker-end="url(#arrGreen)"/>
  <text x="422" y="218" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#4ade80">Đồng bộ</text>

  <!-- 5 Quick Equipment Sets & Protection (Right) -->
  <g transform="translate(465, 100)">
    <rect width="695" height="285" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect width="695" height="42" rx="14" fill="#0284c7"/>
    <text x="347" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#ffffff">HỆ THỐNG LƯU &amp; MẶC NHANH 5 BỘ TRANG BỊ (SƯ PHỤ &amp; ĐỆ TỬ)</text>

    <!-- Row 1: Master Quick Sets s1..s5 -->
    <text x="25" y="72" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#4ade80">★ LƯU 5 SET TRANG BỊ SƯ PHỤ (GÕ "set" ĐỂ LƯU • GÕ "s1" → "s5" ĐỂ MẶC TỨC THÌ)</text>
    <g transform="translate(25, 84)">
      <rect x="0" y="0" width="315" height="65" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
      <text x="157" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#4ade80">SET 1..5 SƯ PHỤ (Lệnh: s1 .. s5)</text>
      <text x="157" y="48" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#dcfce7">Swap 1 giây: Set Hóa Khỉ (s2) ↔ Set Sát Thương (s1)</text>

      <rect x="330" y="0" width="315" height="65" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="487" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#38bdf8">SET 1..5 ĐỆ TỬ (Lệnh: d1 .. d5)</text>
      <text x="487" y="48" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">Đổi nhanh 9 ô trang bị cho Đệ Tử bất kỳ lúc nào</text>
    </g>

    <!-- Row 2: Protection & Smart Auto -->
    <text x="25" y="182" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#fbbf24">★ BẢO VỆ TRANG BỊ TUYỆT ĐỐI &amp; TIỆN ÍCH TỰ ĐỘNG (AUTO TREO QUÁI / SĂN BOSS)</text>
    <g transform="translate(25, 194)">
      <rect x="0" y="0" width="205" height="62" rx="8" fill="#1e1b4b" stroke="#f59e0b"/>
      <text x="102" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Khóa Đồ ("khoa")</text>
      <text x="102" y="46" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">Tự khóa khi lưu vào Set 1..5</text>

      <rect x="220" y="0" width="205" height="62" rx="8" fill="#1e1b4b" stroke="#f59e0b"/>
      <text x="322" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Auto Lọc Đồ ("tq")</text>
      <text x="322" y="46" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">Giữ 100% Đồ Khóa, SKH, Sao</text>

      <rect x="440" y="0" width="205" height="62" rx="8" fill="#1e1b4b" stroke="#f59e0b"/>
      <text x="542" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Auto Săn Boss (Phím B)</text>
      <text x="542" y="46" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">Bảo lưu giờ Máy Dò khi tắt</text>
    </g>
  </g>
</svg>
