<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <linearGradient id="bgInv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131c"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bgInv)" stroke="#0284c7" stroke-width="2"/>
  <text x="600" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="22" font-weight="900" fill="#38bdf8">KIẾN TRÚC HÀNH TRANG ĐA TAB (SLIDING WINDOW MEMORY ARCHITECTURE)</text>
  <text x="600" y="68" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#94a3b8">Khởi tạo mặc định 200 Ô (4 Tab) • Mở rộng tối đa 500 Ô (10 Tab) • Ánh xạ Cửa Sổ Trượt 50 Ô chống tràn gói tin Client</text>

  <!-- Active Client Window (Left) -->
  <g transform="translate(40, 100)">
    <rect width="340" height="285" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="2.5"/>
    <rect width="340" height="42" rx="14" fill="#16a34a"/>
    <text x="170" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#ffffff">CỬA SỔ GIAO DIỆN ĐANG MỞ (50 Ô)</text>
    <text x="170" y="70" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#4ade80">Active Window: Index [0 .. 49]</text>
    <text x="170" y="94" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#cbd5e1">Tương thích 100% Đập Đồ, Giao Dịch, Ký Gửi</text>

    <!-- Mini Grid representing 50 slots -->
    <g transform="translate(30, 112)">
      <rect x="0" y="0" width="280" height="110" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="140" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fde047">[Ô 01] [Ô 02] [Ô 03] ... [Ô 10]</text>
      <text x="140" y="60" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">[Ô 11] [Ô 12] [Ô 13] ... [Ô 20]</text>
      <text x="140" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#a855f7">... Sắp xếp độc lập trong 50 ô ...</text>
    </g>
    <text x="170" y="255" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#f59e0b">Lệnh chuyển nhanh: "t1" .. "t10" hoặc "tab"</text>
  </g>

  <!-- Rotation Arrow -->
  <line x1="390" y1="235" x2="455" y2="235" stroke="#22c55e" stroke-width="3" marker-end="url(#arrGreen)"/>
  <text x="422" y="218" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#4ade80">Ánh xạ</text>

  <!-- 10 Tabs Array (Right) -->
  <g transform="translate(465, 100)">
    <rect width="695" height="285" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect width="695" height="42" rx="14" fill="#0284c7"/>
    <text x="347" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#ffffff">BỘ NHỚ LOGIC ĐA PHÂN VÙNG (LOGICAL MULTI-TAB BUFFER: 200 → 500 Ô)</text>

    <!-- Row 1: Default 4 Tabs (200 Slots) -->
    <text x="25" y="72" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#4ade80">★ MẶC ĐỊNH KHI TẠO NHÂN VẬT: 200 Ô (4 TAB ĐẦU TIÊN MỞ SẴN)</text>
    <g transform="translate(25, 84)">
      <rect x="0" y="0" width="150" height="65" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
      <text x="75" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#4ade80">TAB 1 (Đang Mở)</text>
      <text x="75" y="48" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#dcfce7">Ô 1 → 50 (Trang bị)</text>

      <rect x="165" y="0" width="150" height="65" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="240" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#38bdf8">TAB 2 (Mặc Định)</text>
      <text x="240" y="48" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">Ô 51 → 100 (Đồ SKH)</text>

      <rect x="330" y="0" width="150" height="65" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="405" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#38bdf8">TAB 3 (Mặc Định)</text>
      <text x="405" y="48" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">Ô 101 → 150 (Ngọc Rồng)</text>

      <rect x="495" y="0" width="150" height="65" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="570" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#38bdf8">TAB 4 (Mặc Định)</text>
      <text x="570" y="48" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">Ô 151 → 200 (Treo Quái)</text>
    </g>

    <!-- Row 2: Expandable Tabs 5..10 (201..500 Slots) -->
    <text x="25" y="182" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#fbbf24">★ MỞ RỘNG TỐI ĐA: +300 Ô (TAB 5 → TAB 10 • 50.000 NGỌC XANH / TAB)</text>
    <g transform="translate(25, 194)">
      <rect x="0" y="0" width="100" height="62" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-dasharray="4 3"/>
      <text x="50" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">TAB 5</text>
      <text x="50" y="46" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">201 → 250</text>

      <rect x="110" y="0" width="100" height="62" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-dasharray="4 3"/>
      <text x="160" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">TAB 6</text>
      <text x="160" y="46" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">251 → 300</text>

      <rect x="220" y="0" width="100" height="62" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-dasharray="4 3"/>
      <text x="270" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">TAB 7</text>
      <text x="270" y="46" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">301 → 350</text>

      <rect x="330" y="0" width="100" height="62" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-dasharray="4 3"/>
      <text x="380" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">TAB 8</text>
      <text x="380" y="46" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">351 → 400</text>

      <rect x="440" y="0" width="100" height="62" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-dasharray="4 3"/>
      <text x="490" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">TAB 9</text>
      <text x="490" y="46" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">401 → 450</text>

      <rect x="550" y="0" width="95" height="62" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-dasharray="4 3"/>
      <text x="597" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">TAB 10</text>
      <text x="597" y="46" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">451 → 500</text>
    </g>
  </g>
</svg>

