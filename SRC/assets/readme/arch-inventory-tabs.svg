<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <linearGradient id="bgInv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131c"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bgInv)" stroke="#0284c7" stroke-width="2"/>
  <text x="600" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="22" font-weight="900" fill="#38bdf8">KIẾN TRÚC HÀNH TRANG ĐA TAB (SLIDING WINDOW MEMORY ARCHITECTURE)</text>
  <text x="600" y="68" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#94a3b8">Khởi tạo mặc định 200 Ô (2 Tab × 100 Ô) • Mở rộng tối đa 500 Ô (5 Tab × 100 Ô) tại NPC Santa hoặc Menu "auto"</text>

  <!-- Active Client Window (Left) -->
  <g transform="translate(40, 100)">
    <rect width="340" height="285" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="2.5"/>
    <rect width="340" height="42" rx="14" fill="#16a34a"/>
    <text x="170" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#ffffff">CỬA SỔ GIAO DIỆN ĐANG MỞ (100 Ô)</text>
    <text x="170" y="70" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#4ade80">Active Window: Index [0 .. 99]</text>
    <text x="170" y="94" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#cbd5e1">Tương thích 100% Đập Đồ, Giao Dịch, Ký Gửi</text>

    <!-- Mini Grid representing 100 slots -->
    <g transform="translate(30, 112)">
      <rect x="0" y="0" width="280" height="110" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="140" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fde047">[Ô 001] [Ô 002] ... [Ô 050]</text>
      <text x="140" y="60" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">[Ô 051] [Ô 052] ... [Ô 100]</text>
      <text x="140" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#a855f7">... Sắp xếp độc lập trong 100 ô ...</text>
    </g>
    <text x="170" y="255" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#f59e0b">Lệnh chuyển nhanh: "t1" .. "t5" hoặc "tab"</text>
  </g>

  <!-- Rotation Arrow -->
  <line x1="390" y1="235" x2="455" y2="235" stroke="#22c55e" stroke-width="3" marker-end="url(#arrGreen)"/>
  <text x="422" y="218" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#4ade80">Ánh xạ</text>

  <!-- 10 Tabs Array (Right) -->
  <g transform="translate(465, 100)">
    <rect width="695" height="285" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect width="695" height="42" rx="14" fill="#0284c7"/>
    <text x="347" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#ffffff">BỘ NHỚ LOGIC ĐA PHÂN VÙNG (LOGICAL MULTI-TAB BUFFER: 200 → 500 Ô)</text>

    <!-- Row 1: Default 2 Tabs (200 Slots) -->
    <text x="25" y="72" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#4ade80">★ MẶC ĐỊNH KHI TẠO NHÂN VẬT: 200 Ô (2 TAB × 100 Ô MỞ SẴN)</text>
    <g transform="translate(25, 84)">
      <rect x="0" y="0" width="315" height="65" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
      <text x="157" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#4ade80">TAB 1 (Đang Mở - 100 Ô)</text>
      <text x="157" y="48" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#dcfce7">Ô 1 → 100 (Trang bị chính &amp; Vật phẩm)</text>

      <rect x="330" y="0" width="315" height="65" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="487" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#38bdf8">TAB 2 (Mặc Định - 100 Ô)</text>
      <text x="487" y="48" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">Ô 101 → 200 (Bộ SKH phụ &amp; Ngọc Rồng)</text>
    </g>

    <!-- Row 2: Expandable Tabs 3..5 (201..500 Slots) -->
    <text x="25" y="182" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#fbbf24">★ MỞ RỘNG TỐI ĐA: +300 Ô (TAB 3 → TAB 5 • MUA TẠI SANTA HOẶC MENU "TAB")</text>
    <g transform="translate(25, 194)">
      <rect x="0" y="0" width="205" height="62" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-dasharray="4 3"/>
      <text x="102" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">TAB 3 (100 Ô)</text>
      <text x="102" y="46" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">Ô 201 → 300</text>

      <rect x="220" y="0" width="205" height="62" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-dasharray="4 3"/>
      <text x="322" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">TAB 4 (100 Ô)</text>
      <text x="322" y="46" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">Ô 301 → 400</text>

      <rect x="440" y="0" width="205" height="62" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-dasharray="4 3"/>
      <text x="542" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">TAB 5 (100 Ô)</text>
      <text x="542" y="46" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">Ô 401 → 500</text>
    </g>
  </g>
</svg>

