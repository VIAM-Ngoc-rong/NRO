<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="auto">
  <defs>
    <linearGradient id="bgPlanet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#27121b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" rx="18" fill="url(#bgPlanet)" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="40" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="22" font-weight="900" fill="#fde047">MA TRẬN ĐỊNH HƯỚNG LỐI CHƠI &amp; SET KÍCH HOẠT THEO 3 HÀNH TINH</text>
  <text x="600" y="66" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#cbd5e1">Mỗi hành tinh sở hữu các nhánh Build độc lập: Phối hợp Set Kích Hoạt + Cải Trang Hồng Ngọc + Sao Pha Lê + Nội Tại</text>

  <!-- COLUMN 1: TRAI DAT -->
  <g transform="translate(35, 90)">
    <rect width="360" height="380" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect width="360" height="42" rx="14" fill="#0284c7"/>
    <text x="180" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#ffffff">🌏 HÀNH TINH TRÁI ĐẤT</text>

    <!-- Build 1 -->
    <rect x="16" y="56" width="328" height="96" rx="10" fill="#1e293b" stroke="#38bdf8"/>
    <text x="28" y="80" font-family="Segoe UI, sans-serif" font-size="14.5" font-weight="800" fill="#38bdf8">1. Nhánh Sức Đánh Chưởng (Kamejoko)</text>
    <text x="28" y="102" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#fde047">• Set KH: Set Songoku (+100% ST Kamejoko)</text>
    <text x="28" y="122" font-family="Segoe UI, sans-serif" font-size="12" fill="#e2e8f0">• Cải trang: Quy Lão / Jacky Chun (+50~150% Chưởng)</text>
    <text x="28" y="140" font-family="Segoe UI, sans-serif" font-size="12" fill="#86efac">• Lợi ích: Sát thương sốc tầm xa lớn nhất (DCTT + Kame)</text>

    <!-- Build 2 -->
    <rect x="16" y="164" width="328" height="96" rx="10" fill="#1e293b" stroke="#38bdf8"/>
    <text x="28" y="188" font-family="Segoe UI, sans-serif" font-size="14.5" font-weight="800" fill="#38bdf8">2. Nhánh Đánh KOK &amp; Kênh Khi (Cận Chiến)</text>
    <text x="28" y="210" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#fde047">• Set KH: Set Krillin (+100% Kênh Khi) / Songoku</text>
    <text x="28" y="230" font-family="Segoe UI, sans-serif" font-size="12" fill="#e2e8f0">• Cải trang: Goku SSJ4 / SSJ Blue (+SĐ, Hút 20% HP/KI)</text>
    <text x="28" y="248" font-family="Segoe UI, sans-serif" font-size="12" fill="#86efac">• Lợi ích: Cày quái &amp; solo Boss bền bỉ nhờ hút máu cao</text>

    <!-- Build 3 -->
    <rect x="16" y="272" width="328" height="92" rx="10" fill="#1e293b" stroke="#38bdf8"/>
    <text x="28" y="296" font-family="Segoe UI, sans-serif" font-size="14.5" font-weight="800" fill="#38bdf8">3. Nhánh Khống Chế PK (Thái Dương Hạ San)</text>
    <text x="28" y="318" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#fde047">• Set KH: Set Thiên Xin Hăng (+100% TG Choáng)</text>
    <text x="28" y="338" font-family="Segoe UI, sans-serif" font-size="12" fill="#86efac">• Lợi ích: Làm choáng diện rộng + Thôi miên khóa mục tiêu</text>
  </g>

  <!-- COLUMN 2: NAMEK -->
  <g transform="translate(420, 90)">
    <rect width="360" height="380" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <rect width="360" height="42" rx="14" fill="#16a34a"/>
    <text x="180" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#ffffff">🟢 HÀNH TINH NAMEK</text>

    <!-- Build 1 -->
    <rect x="16" y="56" width="328" height="96" rx="10" fill="#1e293b" stroke="#22c55e"/>
    <text x="28" y="80" font-family="Segoe UI, sans-serif" font-size="14.5" font-weight="800" fill="#4ade80">1. Nhánh Sức Đánh Liên Hoàn (DPS Chủ Lực)</text>
    <text x="28" y="102" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#fde047">• Set KH: Set Pikkoro Daimao (+100% ST Liên Hoàn)</text>
    <text x="28" y="122" font-family="Segoe UI, sans-serif" font-size="12" fill="#e2e8f0">• Cải trang: Zamasu / Super Píc (+SĐ, Hút 20% HP/KI)</text>
    <text x="28" y="140" font-family="Segoe UI, sans-serif" font-size="12" fill="#86efac">• Lợi ích: Tốc độ đánh nhanh nhất, săn Boss cực kỳ ổn định</text>

    <!-- Build 2 -->
    <rect x="16" y="164" width="328" height="96" rx="10" fill="#1e293b" stroke="#22c55e"/>
    <text x="28" y="188" font-family="Segoe UI, sans-serif" font-size="14.5" font-weight="800" fill="#4ade80">2. Nhánh Chuyên KI — Bắn Laze (Makankosappo)</text>
    <text x="28" y="210" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#fde047">• Set KH: Set Picolo (+100% KI tối đa)</text>
    <text x="28" y="230" font-family="Segoe UI, sans-serif" font-size="12" fill="#e2e8f0">• Cải trang: Dr. Lychee / Frieren (+KI, +25~75% ST Laze)</text>
    <text x="28" y="248" font-family="Segoe UI, sans-serif" font-size="12" fill="#86efac">• Lợi ích: Ép full SPL %KI → Bắn Laze xuyên giáp 1 hit cực mạnh</text>

    <!-- Build 3 -->
    <rect x="16" y="272" width="328" height="92" rx="10" fill="#1e293b" stroke="#22c55e"/>
    <text x="28" y="296" font-family="Segoe UI, sans-serif" font-size="14.5" font-weight="800" fill="#4ade80">3. Nhánh Triệu Hồi &amp; Hỗ Trợ (Đẻ Trứng / Trị Thương)</text>
    <text x="28" y="318" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#fde047">• Set KH: Set Ốc Tiêu (+100% ST Đẻ Trứng)</text>
    <text x="28" y="338" font-family="Segoe UI, sans-serif" font-size="12" fill="#86efac">• Lợi ích: Vừa có đệ Cymbal phụ sát thương vừa hồi máu đội</text>
  </g>

  <!-- COLUMN 3: XAYDA -->
  <g transform="translate(805, 90)">
    <rect width="360" height="380" rx="14" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <rect width="360" height="42" rx="14" fill="#e11d48"/>
    <text x="180" y="27" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#ffffff">🔥 HÀNH TINH XAYDA</text>

    <!-- Build 1 -->
    <rect x="16" y="56" width="328" height="96" rx="10" fill="#1e293b" stroke="#f43f5e"/>
    <text x="28" y="80" font-family="Segoe UI, sans-serif" font-size="14.5" font-weight="800" fill="#fb7185">1. Nhánh Sức Đánh Cận Chiến (Đấm Galick)</text>
    <text x="28" y="102" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#fde047">• Set KH: Set Kakarot (+100% ST Đấm Galick)</text>
    <text x="28" y="122" font-family="Segoe UI, sans-serif" font-size="12" fill="#e2e8f0">• Cải trang: Broly / Cumber / Black Rose / Gogeta</text>
    <text x="28" y="140" font-family="Segoe UI, sans-serif" font-size="12" fill="#86efac">• Lợi ích: Chí mạng cao, kết hợp Biến Khỉ nhân đôi Sức Đánh</text>

    <!-- Build 2 -->
    <rect x="16" y="164" width="328" height="96" rx="10" fill="#1e293b" stroke="#f43f5e"/>
    <text x="28" y="188" font-family="Segoe UI, sans-serif" font-size="14.5" font-weight="800" fill="#fb7185">2. Nhánh Chuyên HP — Đánh Bom (Tự Phát Nổ)</text>
    <text x="28" y="210" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#fde047">• Set KH: Set Nappa (+80% HP tối đa)</text>
    <text x="28" y="230" font-family="Segoe UI, sans-serif" font-size="12" fill="#e2e8f0">• Cải trang: Cađíc SSJ2 M / SSJ4 (+HP, +25~75% ST Nổ)</text>
    <text x="28" y="248" font-family="Segoe UI, sans-serif" font-size="12" fill="#86efac">• Lợi ích: Máu cực trâu, Biến Khỉ + Tự Nổ thổi bay Boss &amp; PK</text>

    <!-- Build 3 -->
    <rect x="16" y="272" width="328" height="92" rx="10" fill="#1e293b" stroke="#f43f5e"/>
    <text x="28" y="296" font-family="Segoe UI, sans-serif" font-size="14.5" font-weight="800" fill="#fb7185">3. Nhánh Duy Trì Biến Khỉ (Khỉ Khổng Lồ Liên Tục)</text>
    <text x="28" y="318" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#fde047">• Set KH: Set Cadic (x2 Thời gian Biến Khỉ)</text>
    <text x="28" y="338" font-family="Segoe UI, sans-serif" font-size="12" fill="#86efac">• Lợi ích: Mặc biến khỉ lấy x2 thời gian rồi đổi sang Set Kakarot/Nappa!</text>
  </g>
</svg>
