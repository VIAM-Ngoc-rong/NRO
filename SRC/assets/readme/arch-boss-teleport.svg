<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="auto">
  <defs>
    <linearGradient id="bgBoss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180a0a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <marker id="arrRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="440" rx="18" fill="url(#bgBoss)" stroke="#f43f5e" stroke-width="2"/>
  <text x="600" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="22" font-weight="900" fill="#fb7185">CƠ CHẾ VÒNG ĐỜI BOSS &amp; KHÔNG GIAN DỊCH CHUYỂN (SPATIAL &amp; BOSS TOPOLOGY)</text>
  <text x="600" y="68" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#fda4af">Boss chỉ sinh ra ở Khu 1..N • Thông báo trễ 60s • Dịch chuyển Boss đưa tới Khu 0 • Capsule nhớ chính xác Map &amp; Khu cũ</text>

  <!-- Row 1: Boss Lifecycle State Machine -->
  <g transform="translate(45, 95)">
    <rect width="1110" height="145" rx="14" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="25" y="30" font-family="Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#fb7185">1. VÒNG ĐỜI SINH TỒN &amp; CANH GIỜ HỒI SINH CỦA BOSS</text>

    <rect x="25" y="48" width="235" height="78" rx="10" fill="#1e293b" stroke="#fb7185"/>
    <text x="142" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#fda4af">Hồi Sinh Ngẫu Nhiên</text>
    <text x="142" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#cbd5e1">Chỉ ở Khu 1..N (Khu 0 = 0%)</text>
    <text x="142" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#4ade80">Ẩn thông báo trong 60 giây đầu</text>

    <line x1="265" y1="87" x2="305" y2="87" stroke="#fb7185" stroke-width="2.5" marker-end="url(#arrRed)"/>

    <rect x="310" y="48" width="235" height="78" rx="10" fill="#1e293b" stroke="#fb7185"/>
    <text x="427" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#fde047">Sau 60 Giây: Báo Kênh TG</text>
    <text x="427" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#cbd5e1">Hiện tên Map trên Kênh Thế Giới</text>
    <text x="427" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#93c5fd">Bấm Danh Sách Boss → Tới Khu 0</text>

    <line x1="550" y1="87" x2="590" y2="87" stroke="#fb7185" stroke-width="2.5" marker-end="url(#arrRed)"/>

    <rect x="595" y="48" width="245" height="78" rx="10" fill="#1e293b" stroke="#fb7185"/>
    <text x="717" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#fb7185">Quá 15 Phút Không Ai Đánh</text>
    <text x="717" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#cbd5e1">Khi có người chơi bước vào khu:</text>
    <text x="717" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#fde047">Boss tự biến mất ngay trước mặt!</text>

    <line x1="845" y1="87" x2="885" y2="87" stroke="#fb7185" stroke-width="2.5" marker-end="url(#arrRed)"/>

    <rect x="890" y="48" width="195" height="78" rx="10" fill="#1e293b" stroke="#4ade80"/>
    <text x="987" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#4ade80">Canh Giờ Đợt Mới</text>
    <text x="987" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#cbd5e1">Đếm ngược 10–15 phút</text>
    <text x="987" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#86efac">Người chơi nắm chuẩn giờ!</text>
  </g>

  <!-- Row 2: Boss Teleport Khu 0 & Capsule Memory -->
  <g transform="translate(45, 260)">
    <rect width="1110" height="145" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="25" y="30" font-family="Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#38bdf8">2. CƠ CHẾ DỊCH CHUYỂN TỚI BOSS (MẶC ĐỊNH KHU 0) &amp; CAPSULE VỀ CHỖ CŨ (HỖ TRỢ CẢ MAP TƯƠNG LAI)</text>

    <rect x="25" y="48" width="320" height="78" rx="10" fill="#1e293b" stroke="#38bdf8"/>
    <text x="185" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#38bdf8">Bấm "Danh Sách Boss" (Lệnh: boss)</text>
    <text x="185" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#cbd5e1">• Dịch chuyển thẳng tới KHU 0 của Map Boss</text>
    <text x="185" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#fde047">• Người chơi tự chuyển sang Khu 1..N để dò Boss</text>

    <line x1="350" y1="87" x2="395" y2="87" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrBlue)"/>

    <rect x="400" y="48" width="335" height="78" rx="10" fill="#1e293b" stroke="#38bdf8"/>
    <text x="567" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#4ade80">Bộ Nhớ Vị Trí Cũ (mapBeforeCapsule)</text>
    <text x="567" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#cbd5e1">• Tự động lưu Map + Khu khi dùng Capsule / Về Nhà</text>
    <text x="567" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#86efac">• Không bị ghi đè khi mở Capsule tại Nhà</text>

    <line x1="740" y1="87" x2="785" y2="87" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrBlue)"/>

    <rect x="790" y="48" width="295" height="78" rx="10" fill="#1e293b" stroke="#a855f7"/>
    <text x="937" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#c084fc">Bấm "Về Chỗ Cũ" Trên Capsule</text>
    <text x="937" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#cbd5e1">• Bay thẳng về đúng Map &amp; Khu đang săn</text>
    <text x="937" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#fde047">• Hỗ trợ đầy đủ cả các Map Tương Lai!</text>
  </g>
</svg>
