<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="45%" stop-color="#1a103c"/>
      <stop offset="100%" stop-color="#2d121e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="orbGrad" x1="25%" y1="20%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="20" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Decorative Grid & Aura Circles -->
  <circle cx="1050" cy="170" r="210" fill="none" stroke="#f59e0b" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="1050" cy="170" r="160" fill="none" stroke="#a855f7" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="140" cy="170" r="95" fill="url(#orbGrad)" filter="url(#glow)" opacity="0.92"/>
  <circle cx="115" cy="140" r="24" fill="#ffffff" opacity="0.35"/>

  <!-- 1-Star Dragon Ball Star -->
  <polygon points="140,132 150,156 176,156 155,172 163,196 140,181 117,196 125,172 104,156 130,156" fill="#dc2626"/>

  <!-- Title & Subtitle -->
  <text x="275" y="88" font-family="Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#38bdf8" letter-spacing="3">HỆ SINH THÁI &amp; KIẾN TRÚC GAMEPLAY TOÀN DIỆN</text>
  <text x="275" y="142" font-family="Segoe UI, Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#goldGrad)">NGỌC RỒNG VIAM — BÁCH KHOA TOÀN THƯ</text>
  <text x="275" y="182" font-family="Segoe UI, Roboto, sans-serif" font-size="19" fill="#e2e8f0">Cẩm nang trừu tượng hóa lộ trình từ Tân Thủ đến Đỉnh Cao Thiên Sứ, Đệ Tử 3 Cấp &amp; Săn Boss Chiến Thuật</text>

  <!-- Feature Pills -->
  <g transform="translate(275, 215)">
    <rect x="0" y="0" width="165" height="72" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="82" y="30" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#38bdf8">200 → 500 Ô</text>
    <text x="82" y="54" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">Hành Trang 10 Tab</text>

    <rect x="180" y="0" width="175" height="72" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="267" y="30" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#fbbf24">RƯƠNG SKH</text>
    <text x="267" y="54" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">Tân Thủ Tự Chọn</text>

    <rect x="370" y="0" width="175" height="72" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="457" y="30" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#c084fc">ĐỆ TỬ 3 CẤP</text>
    <text x="457" y="54" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">Thường → Mabư → Broly</text>

    <rect x="560" y="0" width="175" height="72" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="647" y="30" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#4ade80">DỊCH CHUYỂN</text>
    <text x="647" y="54" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">Boss Khu 0 &amp; Capsule</text>

    <rect x="750" y="0" width="150" height="72" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="825" y="30" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#fb7185">9 SAO &amp; SKH</text>
    <text x="825" y="54" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">Đồ Thần &amp; Thiên Sứ</text>
  </g>
</svg>
